version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: webchat_db
    environment:
      POSTGRES_DB: webchat
      POSTGRES_USER: webchat_user
      POSTGRES_PASSWORD: webchat_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webchat_user -d webchat"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: webchat_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://webchat_user:webchat_pass@postgres:5432/webchat
      SECRET_KEY: "change-me-in-production-supersecretkey"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "gemma3:4b"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    container_name: webchat_frontend
    environment:
      VITE_API_URL: "http://localhost:8000"
      VITE_WS_URL: "ws://localhost:8000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
